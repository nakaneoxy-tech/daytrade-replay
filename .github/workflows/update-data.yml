# スマホ版（サーバーなし）用：平日の大引け後に1分足を取得して static/data/ に貯め、GitHub Pages に公開する。
# 銘柄を追加するときは、Actions 画面の「Run workflow」で銘柄コードを入れて実行する。
name: update-data

on:
  schedule:
    - cron: "14 7 * * 1-5"   # 平日 16:14 JST（15:30 の大引け後）
  workflow_dispatch:
    inputs:
      symbols:
        description: "追加する銘柄コード（例: 7203 9984）。空欄なら更新だけ"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["static/**", ".github/workflows/update-data.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: 1分足を取得して書き出す
        if: github.event_name != 'push'
        env:
          SYMBOLS: ${{ github.event.inputs.symbols }}
        run: |
          pip install -r requirements-ci.txt
          python export_static.py $SYMBOLS

      - name: データをコミット
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/data
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Tokyo date +%F) の1分足を追加"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: static
      - id: deploy
        uses: actions/deploy-pages@v4
